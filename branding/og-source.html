<!doctype html>
<!-- Fuente del og-image. Para regenerarlo: copia este archivo y
     branding/logo/logo-mono.svg a public/, corre el sitio, abre /og-source.html
     en un viewport de 1200x630 exactos y captura la pantalla sobre
     public/og-image.png. Después borra las copias de public/: esta página no
     se publica. -->
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <title>Fuente del OG image</title>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .og {
        width: 1200px;
        height: 630px;
        background: var(--cobalt);
        color: var(--white);
        font-family: var(--font-sans);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 80px;
        box-sizing: border-box;
      }
      .og__brand {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 40px;
        font-weight: var(--weight-strong);
        font-stretch: var(--width-heading);
        letter-spacing: var(--tracking-h3);
      }
      .og__mark svg {
        display: block;
        width: 56px;
        height: auto;
      }
      .og__title {
        margin: 0;
        font-size: 112px;
        line-height: 1;
        font-weight: var(--weight-strong);
        font-stretch: var(--width-heading);
        letter-spacing: var(--tracking-display);
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="og__brand">
        <span class="og__mark" id="mark"></span>
        <span>Pragmasyn</span>
      </div>
      <p class="og__title">Deja de adaptarte<br />a tu software.</p>
    </div>
    <script>
      fetch("/logo-mono.svg")
        .then((r) => r.text())
        .then((svg) => {
          document.getElementById("mark").innerHTML = svg;
        });
    </script>
  </body>
</html>
